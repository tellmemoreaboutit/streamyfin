name: Unsigned IPA (SideStore)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27  # GitHub preview image with Xcode 27 (expo-modules-jsi needs it)
    timeout-minutes: 120
    env:
      EXPO_TV: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install Metal toolchain
        run: bash scripts/ios/install-metal-toolchain.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild iOS project
        run: bunx expo prebuild -p ios --clean

      - name: Install pods
        run: cd ios && pod install

      - name: Archive without signing
        run: |
          mkdir -p build
          xcodebuild -version
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          set +e
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/app.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build/xcodebuild.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "=== error lines ==="
            grep -n "error:" build/xcodebuild.log | head -100
            echo "=== failing script phases ==="
            grep -n -B2 -A60 "Run script build phase\|PhaseScriptExecution" build/xcodebuild.log | grep -v "^--$" | tail -300
            echo "=== last 150 lines ==="
            tail -n 150 build/xcodebuild.log
          fi
          exit $status

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/app.xcarchive/Products/Applications/*.app Payload/
          zip -qry Streamyfin-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: streamyfin-slowmo-unsigned-ipa
          path: Streamyfin-unsigned.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7
