name: Unsigned IPA (SideStore)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # upstream builds on Xcode 27; pick the newest Xcode the runner has
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild iOS project
        env:
          EXPO_TV: 0
        run: bunx expo prebuild -p ios --clean

      - name: Install pods
        run: cd ios && pod install

      - name: Archive without signing
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/app.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 50

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/app.xcarchive/Products/Applications/*.app Payload/
          zip -qry Streamyfin-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: streamyfin-slowmo-unsigned-ipa
          path: Streamyfin-unsigned.ipa
          retention-days: 14
